<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>TVITA2000</title>

<script src="https://www.youtube.com/iframe_api"></script>

<style>
body {
margin: 0;
background: black;
font-family: Arial, sans-serif;
overflow: hidden;
}

/* START SCREEN */
#startScreen {
position: absolute;
width: 100%;
height: 100%;
background: black;
display: flex;
justify-content: center;
align-items: center;
flex-direction: column;
color: white;
z-index: 10;
}

#startBtn {
padding: 20px 40px;
font-size: 20px;
cursor: pointer;
}

/* PLAYER */
#player {
width: 100vw;
height: 100vh;
display: none;
background: black;
}

/* CONTROLS */
#controls {
position: absolute;
bottom: 20px;
left: 20px;
z-index: 20;
}

#skipBtn {
padding: 10px 20px;
cursor: pointer;
}
</style>

</head>

<body>

<!-- START -->
<div id="startScreen">
<h1>TVITA2000</h1>
<button id="startBtn">START TV</button>
</div>

<!-- PLAYER -->
<div id="player"></div>

<!-- CONTROLS -->
<div id="controls">
<button id="skipBtn">Cambia Canale</button>
</div>

<script>

let playlist = [];
let recentVideos = [];
const MAX_HISTORY = 5;

let isStarted = false;
let player = null;
let playerReady = false;

const API_URL = "https://script.google.com/macros/s/AKfycbys6e7t9KEClY9bscGjAW1L0I5fZgpriDy9IRhp4fbh4k5pXWg-RzY0CtkFb50IvAAR/exec";

/* =========================
YOUTUBE API READY
========================= */
window.onYouTubeIframeAPIReady = function () {

player = new YT.Player("player", {
height: "100%",
width: "100%",
videoId: "",
playerVars: {
autoplay: 1,
controls: 0,
rel: 0,
playsinline: 1
},
events: {

onReady: () => {

playerReady = true;
console.log("PLAYER READY");

if (isStarted && playlist.length > 0) {
nextVideo();
}

},

onStateChange: (event) => {

if (event.data === YT.PlayerState.ENDED) {
nextVideo();
========================= */
function loadVideo(video) {

if (!video || !video.videoUrl) return;
if (!playerReady) return;

const id = getVideoId(video.videoUrl);

if (!id) return;

player.loadVideoById(id);

unlockAudio();

}

/* =========================
NEXT VIDEO
========================= */
function nextVideo() {

if (!isStarted) return;

const video = getRandomVideo();

if (!video) return;

loadVideo(video);

}

/* =========================
START TV
========================= */
document.getElementById("startBtn").addEventListener("click", () => {

document.getElementById("startScreen").style.display = "none";
document.getElementById("player").style.display = "block";

isStarted = true;

if (playerReady && playlist.length > 0) {
nextVideo();
}

unlockAudio();

});

/* =========================
SKIP
========================= */
document.getElementById("skipBtn").addEventListener("click", () => {
nextVideo();
});

/* =========================
FETCH PLAYLIST
========================= */
fetch(API_URL)
.then(res => res.json())
.then(data => {
playlist = data || [];
})
.catch(err => {
console.error("API error", err);
playlist = [];
});

</script>

</body>
</html>
