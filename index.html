<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>TVITA2000</title>

<script async src="https://www.googletagmanager.com/gtag/js?id=G-C4GRTQTN1L"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-C4GRTQTN1L');
</script>

<script src="https://www.youtube.com/iframe_api"></script>

<style>
body {
margin: 0;
background: black;
font-family: Arial, sans-serif;
overflow: hidden;
}

/* =========================
TV CONTAINER (NUOVO SISTEMA)
========================= */

#tvContainer {
position: absolute;
width: 100vw;
height: 100vh;
display: flex;
justify-content: center;
align-items: center;
}

/* SCHERMO TV (VIDEO AREA) */
#player {
position: absolute;
width: 1408px;
height: 792px;
background: black;
z-index: 1;
display: none;
}

/* TV FRAME */
#tvFrame {
position: absolute;
width: 100vw;
height: 100vh;
z-index: 5;
pointer-events: none;
display: flex;
justify-content: center;
align-items: center;
}

#tvFrame img {
width: 100%;
height: 100%;
object-fit: contain;
}

/* START SCREEN */
#startScreen {
position: absolute;
width: 100%;
height: 100%;
background: black;
display: flex;
justify-content: center;
align-items: center;
flex-direction: column;
color: white;
z-index: 10;
}

#startBtn {
padding: 20px 40px;
font-size: 20px;
cursor: pointer;
}

/* POPUP */
#popupOverlay {
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
background: rgba(0,0,0,0.85);
display: flex;
justify-content: center;
align-items: center;
z-index: 999;
}

#popupBox {
width: 80%;
max-width: 420px;
background: #0B0F1A;
color: #E6E6E6;
border: 1px solid rgba(45,125,255,0.25);
}

/* CONTROLS (PNG LAYER) */
#controls {
position: absolute;
width: 100%;
height: 100%;
z-index: 20;
pointer-events: none;
}

/* START BTN PNG */
#popupStartBtn {
position: absolute;
bottom: 12%;
left: 22%;
width: 140px;
cursor: pointer;
pointer-events: auto;
}

/* SKIP BTN PNG */
#skipBtn {
position: absolute;
bottom: 12%;
right: 20%;
width: 260px;
cursor: pointer;
pointer-events: auto;
}

/* START TEXT BUTTON FALLBACK */
#startBtn {
z-index: 30;
}

</style>

</head>

<body>

<!-- TV SYSTEM -->
<div id="tvContainer">

<!-- VIDEO -->
<div id="player"></div>

<!-- FRAME -->
<div id="tvFrame">
<img src="assets/tv-frame.png">
</div>

</div>

<!-- POPUP -->
<div id="popupOverlay">
<div id="popupBox">

<h2>Zapping2000</h2>

<p>Macchina del tempo televisiva anni 2000.</p>
<p>Versione alpha in sviluppo.</p>

<hr>

<p>Cartoni, serie TV, pubblicità 2002–2012.</p>

<p>Ispirato da MyRetroTVs.com</p>

<button id="popupStartBtn">START TV</button>

</div>
</div>

<!-- START SCREEN -->
<div id="startScreen">
<h1>TVITA2000</h1>
<button id="startBtn">START TV</button>
</div>

<!-- CONTROLS PNG OVERLAY -->
<div id="controls">

<img id="skipBtn" src="assets/skip.png">

</div>

<script>

let playlist = [];
let recentVideos = [];
const MAX_HISTORY = 5;

let isStarted = false;
let player = null;
let playerReady = false;

const API_URL = "https://script.google.com/macros/s/AKfycbys6e7t9KEClY9bscGjAW1L0I5fZgpriDy9IRhp4fbh4k5pXWg-RzY0CtkFb50IvAAR/exec";

/* YOUTUBE */
function onYouTubeIframeAPIReady() {
player = new YT.Player("player", {
height: "100%",
width: "100%",
videoId: "",
playerVars: {
autoplay: 1,
controls: 0,
rel: 0,
playsinline: 1
},
events: {
onReady: () => playerReady = true,
onStateChange: (event) => {
if (!playerReady || !isStarted) return;
if (event.data === YT.PlayerState.ENDED) nextVideo();
}
}
});
}

/* START */
document.getElementById("popupStartBtn").addEventListener("click", () => {
document.getElementById("popupOverlay").style.display = "none";
document.getElementById("startScreen").style.display = "none";
document.getElementById("player").style.display = "block";
isStarted = true;

setTimeout(() => {
if (playlist.length && playerReady) nextVideo();
}, 800);
});

/* SKIP */
document.getElementById("skipBtn").addEventListener("click", () => {
nextVideo();
});

/* RANDOM */
function getRandomVideo() {
if (!playlist.length) return null;

let filtered = playlist.filter(v =>
v.videoUrl && !recentVideos.includes(v.videoUrl)
);

if (!filtered.length) {
recentVideos = [];
filtered = playlist;
}

const video = filtered[Math.floor(Math.random() * filtered.length)];

recentVideos.push(video.videoUrl);
if (recentVideos.length > MAX_HISTORY) recentVideos.shift();

return video;
}

function loadVideo(video) {
if (!video) return;

const id = video.videoUrl.split("watch?v=")[1]?.split("&")[0]
|| video.videoUrl.split("youtu.be/")[1];

if (!id) return;

player.loadVideoById(id);
}

function nextVideo() {
if (!isStarted) return;
const video = getRandomVideo();
if (!video) return;
loadVideo(video);
}

fetch(API_URL)
.then(r => r.json())
.then(data => playlist = data || [])
.catch(err => console.error(err));

</script>

</body>
</html>
