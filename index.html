<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>TVITA2000</title>

<script async src="https://www.googletagmanager.com/gtag/js?id=G-C4GRTQTN1L"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-C4GRTQTN1L');
</script>

<script src="https://www.youtube.com/iframe_api"></script>

<style>
body {
margin: 0;
background: black;
overflow: hidden;
font-family: Arial, sans-serif;
}

/* =========================
TV CORE
========================= */

#tvContainer {
position: absolute;
width: 100vw;
height: 100vh;
display: flex;
justify-content: center;
align-items: center;
}

/* VIDEO AREA */
#tvScreen {
position: absolute;
width: 1408px;
height: 792px;
z-index: 1;
overflow: hidden;
background: black;
}

#player {
width: 100%;
height: 100%;
}

/* TV FRAME */
#tvFrame {
position: absolute;
width: 100%;
height: 100%;
padding: 20px;
border: 1px solid rgba(45,125,255,0.25);
}

#popupStartBtn {
margin-top: 12px;
width: 100%;
padding: 12px;
background: #1E5BC6;
color: white;
border: none;
cursor: pointer;
font-size: 14px;
}

/* =========================
UI PNG LAYER (IMPORTANT)
========================= */

#uiLayer {
position: absolute;
width: 100vw;
height: 100vh;
z-index: 20;
}

/* START PNG */
#startBtn {
position: absolute;
bottom: 6.5%;
left: 18%;
width: 150px;
cursor: pointer;
}

/* SKIP PNG */
#skipBtn {
position: absolute;
bottom: 6.5%;
right: 18%;
width: 320px;
cursor: pointer;
}

/* =========================
START SCREEN (fallback)
========================= */

#startScreen {
position: absolute;
width: 100%;
height: 100%;
background: black;
display: none;
justify-content: center;
align-items: center;
flex-direction: column;
color: white;
z-index: 10;
}

</style>
</head>

<body>

<!-- TV CORE -->
<div id="tvContainer">

<div id="tvScreen">
<div id="player"></div>
</div>

<div id="tvFrame">
<img src="assets/tv-frame.png">
</div>

</div>

<!-- POPUP -->
<div id="popupOverlay">
<div id="popupBox">
<h2>Zapping2000</h2>
<p>Macchina del tempo televisiva anni 2000.</p>
<p>Versione alpha in sviluppo.</p>

<button id="popupStartBtn">START TV</button>
</div>
</div>

<!-- UI PNG LAYER -->
<div id="uiLayer">

<img id="startBtn" src="assets/start.png">
<img id="skipBtn" src="assets/skip.png">

</div>

<script>

let playlist = [];
let recentVideos = [];
let isStarted = false;
let player = null;
let playerReady = false;

const API_URL = "https://script.google.com/macros/s/AKfycbys6e7t9KEClY9bscGjAW1L0I5fZgpriDy9IRhp4fbh4k5pXWg-RzY0CtkFb50IvAAR/exec";

/* =========================
YOUTUBE
========================= */

function onYouTubeIframeAPIReady() {
player = new YT.Player("player", {
height: "100%",
width: "100%",
videoId: "",
playerVars: {
autoplay: 1,
controls: 0,
rel: 0,
playsinline: 1
},
events: {
onReady: () => playerReady = true,
onStateChange: (e) => {
if (!playerReady || !isStarted) return;
if (e.data === YT.PlayerState.ENDED) nextVideo();
}
}
});
}

/* =========================
START FLOW
========================= */

document.getElementById("popupStartBtn").addEventListener("click", () => {
document.getElementById("popupOverlay").style.display = "none";
isStarted = true;

setTimeout(() => {
if (playlist.length && playerReady) nextVideo();
}, 800);
});

/* START PNG CLICK */
document.getElementById("startBtn").addEventListener("click", () => {
document.getElementById("popupOverlay").style.display = "none";
isStarted = true;
});

/* SKIP PNG CLICK */
document.getElementById("skipBtn").addEventListener("click", () => {
nextVideo();
});

/* =========================
VIDEO LOGIC
========================= */

function getRandomVideo() {
if (!playlist.length) return null;

let filtered = playlist.filter(v =>
v.videoUrl && !recentVideos.includes(v.videoUrl)
);

if (!filtered.length) {
recentVideos = [];
filtered = playlist;
}

const video = filtered[Math.floor(Math.random() * filtered.length)];
recentVideos.push(video.videoUrl);
if (recentVideos.length > 5) recentVideos.shift();

return video;
}

function loadVideo(video) {
if (!video) return;

const id =
video.videoUrl.split("watch?v=")[1]?.split("&")[0] ||
video.videoUrl.split("youtu.be/")[1];

if (!id) return;

player.loadVideoById(id);
}

function nextVideo() {
if (!isStarted) return;
const video = getRandomVideo();
if (!video) return;
loadVideo(video);
}

/* FETCH */
fetch(API_URL)
.then(r => r.json())
.then(data => playlist = data || [])
.catch(err => console.error(err));

</script>

</body>
</html>
