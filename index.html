<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>TVITA2000</title>

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-C4GRTQTN1L"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-C4GRTQTN1L');

<script src="https://www.youtube.com/iframe_api"></script>

<style>
body {
margin: 0;
background: black;
font-family: Arial, sans-serif;
overflow: hidden;
}

/* START SCREEN */
#startScreen {
position: absolute;
width: 100%;
height: 100%;
background: black;
display: flex;
justify-content: center;
align-items: center;
flex-direction: column;
color: white;
z-index: 10;
}

#startBtn {
padding: 20px 40px;
font-size: 20px;
cursor: pointer;
}

/* =========================
TV STABLE SYSTEM (SIMPLIFIED RELATIVE)
========================= */

/* WRAPPER CENTRATO */
#tvWrapper {
position: absolute;
width: 100%;
height: 100%;
display: flex;
justify-content: center;
align-items: center;
}

/* TV SYSTEM BASE */
#tv {
position: relative;
width: min(1920px, 100vw);
height: calc(min(1920px, 100vw) * 0.5625);
}

/* SCHERMO (FIXED LOGIC WITHOUT PX OFFSETS) */
#tvScreen {
position: absolute;

/* CENTRATO MATEMATICAMENTE */
left: 50%;
top: 50%;
transform: translate(-50%, -50%);

/* proporzione interna corretta (16:9 derivata da 1408x792) */
width: 73.333vw;
height: calc(73.333vw * 0.5625);

overflow: hidden;
z-index: 1;
}

/* PLAYER FORZATO FULL FIT */
#tvScreen iframe,
#tvScreen > div {
width: 100% !important;
height: 100% !important;
position: absolute;
top: 0;
left: 0;
border: none;
}

/* PLAYER FALLBACK */
#player {
width: 100%;
height: 100%;
display: none;
background: black;
}

/* CONTROLS */
#controls {
position: absolute;
bottom: 20px;
left: 20px;
z-index: 20;
}

#skipBtn {
padding: 10px 20px;
cursor: pointer;
}

/* =========================
POPUP (UNCHANGED)
========================= */

#popupOverlay {
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
background: rgba(0,0,0,0.85);
display: flex;
justify-content: center;
align-items: center;
z-index: 999;
}

#popupBox {
width: 80%;
max-width: 420px;
background: #0B0F1A;
border: 1px solid rgba(45,125,255,0.25);
color: #E6E6E6;
box-shadow: 0 0 20px rgba(30,91,198,0.25);
font-family: Arial, sans-serif;
}

#popupHeader {
background: #0A3D91;
color: white;
padding: 10px;
font-weight: bold;
font-size: 14px;
}

#popupContent {
padding: 18px;
font-size: 13px;
line-height: 1.4;
}

#popupContent h1 {
font-size: 16px;
margin-bottom: 10px;
color: white;
}

#popupContent p {
margin: 8px 0;
opacity: 0.95;
}

#popupContent hr {
border: none;
border-top: 1px solid rgba(255,255,255,0.08);
margin: 10px 0;
}

.credits {
font-size: 12px;
opacity: 0.7;
}

#popupStartBtn {
margin-top: 12px;
width: 100%;
padding: 12px;
background: #1E5BC6;
color: white;
border: none;
cursor: pointer;
font-size: 14px;
}

#popupStartBtn:hover {
background: #2D7DFF;
}

</style>

</head>

<body>

<!-- POPUP -->
<div id="popupOverlay">
<div id="popupBox">
<div id="popupHeader">Zapping2000</div>
<div id="popupContent">

<h1>Benvenuto su Zapping2000</h1>

<p>Questa è una macchina del tempo televisiva, pensata per riportarti direttamente agli anni 2000.</p>

<hr>

<p>Qui troverai cartoni, serie TV, pubblicità, varietà e spezzoni tra il 2002 e il 2012.</p>

<p class="credits">Ispirato da MyRetroTVs.com</p>

<button id="popupStartBtn">START TV</button>

</div>
</div>
</div>

<!-- START -->
<div id="startScreen">
<h1>TVITA2000</h1>
<button id="startBtn">START TV</button>
</div>

<!-- TV SYSTEM -->
<div id="tvWrapper">

<div id="tv">

<div id="tvScreen">
<div id="player"></div>
</div>

</div>

</div>

<!-- CONTROLS -->
<div id="controls">
<button id="skipBtn">Cambia Canale</button>
</div>

<script>

let playlist = [];
let recentVideos = [];
const MAX_HISTORY = 5;

let isStarted = false;
let player = null;
let playerReady = false;

const API_URL = "https://script.google.com/macros/s/AKfycbys6e7t9KEClY9bscGjAW1L0I5fZgpriDy9IRhp4fbh4k5pXWg-RzY0CtkFb50IvAAR/exec";

/* YOUTUBE */
function onYouTubeIframeAPIReady() {
player = new YT.Player("player", {
height: "100%",
width: "100%",
videoId: "",
playerVars: {
autoplay: 1,
controls: 0,
rel: 0,
playsinline: 1
},
events: {
onReady: () => {
playerReady = true;
},
onStateChange: (event) => {
if (!playerReady || !isStarted) return;
if (event.data === YT.PlayerState.ENDED) nextVideo();
}
}
});
}

/* START */
document.getElementById("popupStartBtn").addEventListener("click", () => {
document.getElementById("popupOverlay").style.display = "none";
document.getElementById("startScreen").style.display = "none";
document.getElementById("player").style.display = "block";

isStarted = true;

setTimeout(() => {
if (playlist.length && playerReady) nextVideo();
}, 800);
});

/* SKIP */
document.getElementById("skipBtn").addEventListener("click", () => {
nextVideo();
});

/* RANDOM VIDEO */
function getRandomVideo() {
if (!playlist.length) return null;

let filtered = playlist.filter(v =>
v.videoUrl && !recentVideos.includes(v.videoUrl)
);

if (!filtered.length) {
recentVideos = [];
filtered = playlist;
}

const video = filtered[Math.floor(Math.random() * playlist.length)];

recentVideos.push(video.videoUrl);
if (recentVideos.length > MAX_HISTORY) recentVideos.shift();

return video;
}

/* LOAD */
function loadVideo(video) {
if (!video) return;

const id = video.videoUrl.split("watch?v=")[1]?.split("&")[0]
|| video.videoUrl.split("youtu.be/")[1];

if (!id) return;

player.loadVideoById(id);
}

/* NEXT */
function nextVideo() {
if (!isStarted) return;
const video = getRandomVideo();
if (!video) return;
loadVideo(video);
}

/* FETCH */
fetch(API_URL)
.then(r => r.json())
.then(data => playlist = data || [])
.catch(err => console.error(err));

</script>

</body>
</html>
