<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>TVITA2000</title>

<!-- YOUTUBE IFRAME API -->
<script src="https://www.youtube.com/iframe_api"></script>

<style>
body {
margin: 0;
background: black;
font-family: Arial, sans-serif;
overflow: hidden;
}

/* START SCREEN */
#startScreen {
position: absolute;
width: 100%;
height: 100%;
background: black;
display: flex;
justify-content: center;
align-items: center;
flex-direction: column;
color: white;
z-index: 10;
}

#startBtn {
padding: 20px 40px;
font-size: 20px;
cursor: pointer;
}

/* PLAYER */
#player {
width: 100vw;
height: 100vh;
display: none;
background: black;
}

/* CONTROLS */
#controls {
position: absolute;
bottom: 20px;
left: 20px;
z-index: 20;
}

#skipBtn {
padding: 10px 20px;
cursor: pointer;
}

/* GLITCH */
#glitch {
position: absolute;
width: 100%;
height: 100%;
background: black;
display: none;
z-index: 15;
}
</style>

</head>

<body>

<!-- START -->
<div id="startScreen">
<h1>TVITA2000</h1>
<button id="startBtn">START TV</button>
</div>

<!-- GLITCH -->
<div id="glitch"></div>

<!-- PLAYER (API controlla questo div) -->
<div id="player"></div>

<!-- CONTROLS -->
<div id="controls">
<button id="skipBtn">Cambia Canale</button>
</div>

<script>

let playlist = [];
let recentVideos = [];
const MAX_HISTORY = 5;

let isStarted = false;
let player;

const API_URL = "https://script.googleusercontent.com/macros/echo?user_content_key=AUkAhnS6BBtyQFuwHO7NFwOnoh3dYDhM9GK0WxBYU8SQIo9Cp7czAHmpJR1ZSA_R09zdPW6muuYjyuZfjeHB2h-zDsW4DXeOrl7URYfHstijVTSTCU7SJPJlci1wt6WvEIYI0N8mvh_mqtgpOPFsI-8wYqZkydN2OIXfY2M1GK_0tWSIzOJqgmDo05bG40YzI5kohYfnr-q1mdBZNkam08wxNPhyPiC7ipuPk7IxgjMFuFC8hSJG70RWNZ9di_x47AUhdO98aGSgEQJKozTYDMLfo_AuuQ85aE&lib=Mx2bH8SXqni6gioWW51Nzuxv87HI9RohF";

/* YOUTUBE API READY */
function onYouTubeIframeAPIReady() {
player = new YT.Player("player", {
height: "100%",
width: "100%",
videoId: "",
playerVars: {
autoplay: 1,
controls: 0,
rel: 0,
playsinline: 1
}
});
}

/* AUDIO UNLOCK */
function unlockAudio() {
try {
player.unMute();
player.setVolume(100);
} catch (e) {}
}

/* GLITCH EFFECT */
function showGlitch(callback) {
document.getElementById("glitch").style.display = "block";

setTimeout(() => {
document.getElementById("glitch").style.display = "none";
callback();
}, 250);
}

/* RANDOM VIDEO */
function getRandomVideo() {
if (!playlist || playlist.length === 0) return null;

let filtered = playlist.filter(v => v.videoUrl && !recentVideos.includes(v.videoUrl));

if (filtered.length === 0) {
recentVideos = [];
filtered = playlist;
}

const video = filtered[Math.floor(Math.random() * filtered.length)];

recentVideos.push(video.videoUrl);

if (recentVideos.length > MAX_HISTORY) {
recentVideos.shift();
}

return video;
}

/* EXTRACT ID */
function getVideoId(url) {
if (!url) return "";

if (url.includes("watch?v=")) {
return url.split("watch?v=")[1].split("&")[0];
}

if (url.includes("youtu.be/")) {
return url.split("youtu.be/")[1].split("?")[0];
}

return "";
}

/* LOAD VIDEO (PRO ENGINE) */
function loadVideo(video) {
if (!video || !video.videoUrl) return;

const id = getVideoId(video.videoUrl);

player.loadVideoById(id);

unlockAudio();
}

/* NEXT VIDEO */
function nextVideo() {
if (!isStarted) return;

const video = getRandomVideo();
if (!video) return;

showGlitch(() => {
loadVideo(video);
});
}

/* START TV */
document.getElementById("startBtn").addEventListener("click", () => {

document.getElementById("startScreen").style.display = "none";
document.getElementById("player").style.display = "block";

isStarted = true;

setTimeout(() => {
if (playlist.length > 0) nextVideo();
}, 500);
});

/* SKIP */
document.getElementById("skipBtn").addEventListener("click", () => {
nextVideo();
});

/* FETCH PLAYLIST */
fetch(API_URL)
.then(res => res.json())
.then(data => {
playlist = data || [];

if (isStarted) nextVideo();
})
.catch(err => {
console.error("API error", err);
playlist = [];
});

</script>

</body>
</html>
