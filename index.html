<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>TVITA2000</title>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-C4GRTQTN1L"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-C4GRTQTN1L');
</script>
<script src="https://www.youtube.com/iframe_api"></script>

<style>
body {
margin: 0;
background: black;
font-family: Arial, sans-serif;
overflow: hidden;
}

/* START SCREEN */
#startScreen {
position: absolute;
width: 100%;
height: 100%;
background: black;
display: flex;
justify-content: center;
align-items: center;
flex-direction: column;
color: white;
z-index: 10;
}

#startBtn {
padding: 20px 40px;
font-size: 20px;
cursor: pointer;
}

/* PLAYER */
#player {
width: 100vw;
height: 100vh;
display: none;
background: black;
}

/* CONTROLS */
#controls {
position: absolute;
bottom: 20px;
left: 20px;
z-index: 20;
}

#skipBtn {
padding: 10px 20px;
cursor: pointer;
}
</style>

</head>

<body>

<!-- START -->
<div id="startScreen">
<h1>TVITA2000</h1>
<button id="startBtn">START TV</button>
</div>

<!-- PLAYER -->
<div id="player"></div>

<!-- CONTROLS -->
<div id="controls">
<button id="skipBtn">Cambia Canale</button>
</div>

<script>

let playlist = [];
let recentVideos = [];
const MAX_HISTORY = 5;

let isStarted = false;
let player = null;
let playerReady = false;

const API_URL = "https://script.google.com/macros/s/AKfycbys6e7t9KEClY9bscGjAW1L0I5fZgpriDy9IRhp4fbh4k5pXWg-RzY0CtkFb50IvAAR/exec";

/* =========================
YOUTUBE API READY
========================= */
function onYouTubeIframeAPIReady() {
player = new YT.Player("player", {
height: "100%",
width: "100%",
videoId: "",
playerVars: {
autoplay: 1,
controls: 0,
rel: 0,
playsinline: 1
},
events: {
onReady: () => {
playerReady = true;
console.log("PLAYER READY");
},
 onStateChange: (event) => {

    if (!playerReady || !isStarted) return;

    if (event.data === YT.PlayerState.ENDED) {
      nextVideo();
	 }
}	 
}
});
}

/* =========================
AUDIO FIX
========================= */
function unlockAudio() {
if (!playerReady) return;
try {
player.unMute();
player.setVolume(100);
} catch (e) {}
}

/* =========================
RANDOM VIDEO
========================= */
function getRandomVideo() {
if (!playlist || playlist.length === 0) return null;

let filtered = playlist.filter(v =>
v.videoUrl && !recentVideos.includes(v.videoUrl)
);

if (filtered.length === 0) {
recentVideos = [];
filtered = playlist;
}

const video = filtered[Math.floor(Math.random() * filtered.length)];

recentVideos.push(video.videoUrl);
if (recentVideos.length > MAX_HISTORY) recentVideos.shift();

return video;
}

/* =========================
EXTRACT ID
========================= */
function getVideoId(url) {
if (!url) return "";

if (url.includes("watch?v=")) {
return url.split("watch?v=")[1].split("&")[0];
}

if (url.includes("youtu.be/")) {
return url.split("youtu.be/")[1].split("?")[0];
}

return "";
}

/* =========================
LOAD VIDEO (SAFE)
========================= */
function loadVideo(video) {
if (!video || !video.videoUrl) return;
if (!playerReady) return;

const id = getVideoId(video.videoUrl);

player.loadVideoById(id);
unlockAudio();
}

/* =========================
NEXT VIDEO
========================= */
function nextVideo() {
if (!isStarted) return;

const video = getRandomVideo();
if (!video) return;

loadVideo(video);
}

/* =========================
START TV
========================= */
document.getElementById("startBtn").addEventListener("click", () => {

document.getElementById("startScreen").style.display = "none";
document.getElementById("player").style.display = "block";

isStarted = true;

setTimeout(() => {
if (playlist.length > 0 && playerReady) {
nextVideo();
}
}, 800);
});

/* =========================
SKIP
========================= */
document.getElementById("skipBtn").addEventListener("click", () => {
nextVideo();
});

/* =========================
FETCH PLAYLIST
========================= */
fetch(API_URL)
.then(res => res.json())
.then(data => {
playlist = data || [];
})
.catch(err => {
console.error("API error", err);
playlist = [];
});

</script>

</body>
</html>
